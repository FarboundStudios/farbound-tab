<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Farbound Tab S1</title>
<script src="../drive/variants.js"></script>
<style>
:root{--accent:#f0a30a;--glass:rgba(24,30,40,.55);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--text:#fff;--sub:rgba(255,255,255,.62);--bar:40px;--gest:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:"Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;user-select:none}
/* fond d'ecran: route de nuit */
#wall{position:fixed;inset:0;background:
 radial-gradient(900px 500px at 85% 110%,rgba(240,163,10,.35),transparent 60%),
 radial-gradient(700px 500px at 10% -10%,rgba(51,120,255,.30),transparent 60%),
 linear-gradient(160deg,#0b1220,#101a2c 55%,#1a1424)}
#wall{background-size:cover;background-position:center}#wall.plain:after{display:none}
#wall:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-6%;height:46%;background:
 linear-gradient(#0000,#0008),repeating-linear-gradient(90deg,#fff1 0 2px,#0000 2px 90px);transform:perspective(500px) rotateX(62deg);transform-origin:bottom;opacity:.5}
#status{position:fixed;left:0;right:0;top:0;height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:30;font-size:14px;font-weight:600;background:linear-gradient(#0009,#0000)}
#status .sp{flex:1}
#status svg{width:18px;height:18px;fill:currentColor;opacity:.9}
#st-gps{color:#ff6b5e}#st-gps.on{color:#4ade80}
#stage{position:fixed;left:0;right:0;top:0;bottom:0}
.page{position:absolute;inset:0;display:none}
.page:not(.show){display:none!important}
.page.show{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.page iframe{position:absolute;left:0;right:0;top:var(--bar);bottom:var(--gest);width:100%;height:calc(100% - var(--bar) - var(--gest));border:0;background:#000;border-radius:0}
.page.show.app{background:#000}
/* accueil */
#home{display:none;padding:calc(var(--bar) + 18px) 34px 150px;overflow:auto}
#home.show{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:34px;align-content:start}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 10px 30px #0005}
#left{display:flex;flex-direction:column;gap:18px}
#clock{padding:22px 26px}
#clock .t{font-size:78px;font-weight:300;line-height:1;letter-spacing:-.02em}
#clock .d{margin-top:6px;color:var(--sub);font-size:16px;text-transform:capitalize}
#truck{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
#truck .k{font-size:11px;color:var(--sub);letter-spacing:.12em;text-transform:uppercase}
#truck .v{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
#truck .v small{font-size:14px;color:var(--sub);font-weight:500;margin-left:3px}
#truck .full{grid-column:1/-1}
.bar{height:8px;border-radius:5px;background:#fff2;overflow:hidden;margin-top:8px}
#fuelbar{height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .6s,background .6s}
#np{padding:16px 22px;display:flex;align-items:center;gap:14px;cursor:pointer}
#np .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#a855f7,#6d28d9)}
#np small{color:var(--sub);display:block;font-size:12px}
#grid .app.drag{position:fixed;z-index:200;pointer-events:none;opacity:.85;transform:scale(1.1)}#grid .app.ghost{opacity:.25}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 18px;align-content:start;padding-top:8px}
.app{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:transform .12s}
.app:not(.page):active{transform:scale(.92)}
.page.app{cursor:default;transition:none}.page.app:active{transform:none}
.ic{width:88px;height:88px;border-radius:26px;display:grid;place-items:center;box-shadow:0 8px 20px #0007,inset 0 1px 0 #fff4,inset 0 -10px 20px #0003}
.ic svg{width:48px;height:48px;fill:#fff}
.app span{font-size:14px;font-weight:500;text-shadow:0 1px 4px #000a}
/* dock */
#dock{position:fixed;left:50%;bottom:calc(var(--gest) + 12px);transform:translateX(-50%);display:flex;gap:18px;padding:12px 20px;border-radius:34px;z-index:25}
#dock .ic{width:68px;height:68px;border-radius:21px}#dock .ic svg{width:38px;height:38px}
#dock.hide{display:none}
/* barre de gestes */
#gest{position:fixed;left:0;right:0;bottom:0;height:var(--gest);display:flex;justify-content:center;align-items:center;gap:90px;z-index:40;background:linear-gradient(#0000,#000a)}
#gest button{background:none;border:0;color:#fff;opacity:.75;width:60px;height:var(--gest);cursor:pointer;display:grid;place-items:center;padding:0}
#gest button:active{opacity:1}
#gest svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#gest #b-kb{left:18px;right:auto;font-size:22px}
#gest .sc{position:absolute;right:18px;width:54px!important;font-size:18px;color:#fff}#gest #b-up{right:78px}#gest #b-dn{right:18px}
#gest #b-home i{display:block;width:120px;height:5px;border-radius:3px;background:#fff}
/* recents */
#recents{position:fixed;inset:0;background:#05080fcc;backdrop-filter:blur(26px);z-index:35;display:none;padding:calc(var(--bar) + 30px) 40px var(--gest);align-items:center;gap:24px;overflow-x:auto}
#recents.show{display:flex}
.card{width:260px;flex:none;cursor:pointer;display:flex;flex-direction:column;gap:12px;align-items:center}
.card .pv{width:100%;height:340px;border-radius:26px;display:grid;place-items:center;position:relative;box-shadow:0 14px 34px #0008}
.card .pv svg{width:90px;height:90px;fill:#fff}
.card .x{position:absolute;top:10px;right:10px;border:0;background:#0006;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.card b{font-weight:600}
#empty{margin:auto;color:var(--sub);font-size:18px}
/* reglages */
.settings{position:absolute;inset:0;padding:calc(var(--bar) + 20px) 34px 80px;overflow-y:auto;max-width:none}
.sbtns{position:absolute;right:12px;bottom:calc(var(--gest) + 10px);display:flex;flex-direction:column;gap:8px;z-index:6}.sbtns button{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#1a1200;font-size:20px;font-weight:800;cursor:pointer;opacity:.92}
.settings h2{margin:0 0 6px;font-size:30px;font-weight:600}.settings p{color:var(--sub);margin:0 0 16px}
.settings input{width:100%;background:var(--glass2);border:1px solid var(--line);color:#fff;border-radius:16px;padding:15px 18px;font-size:16px;margin-bottom:12px;outline:none}
.settings input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#1a1200;font-weight:700;border:0;border-radius:16px;padding:14px 22px;font-size:16px;cursor:pointer}
.btn.d{background:#ff453a33;color:#ff8d85;padding:10px 16px}
.settings li{list-style:none;margin:10px 0;padding:14px 18px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--line)}
.settings ul{padding:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:6px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#fff;background-clip:padding-box}
#osk{position:fixed;left:0;right:0;bottom:var(--gest);z-index:45;display:none;background:rgba(14,18,28,.96);border-top:1px solid var(--line);padding:8px 10px 6px;backdrop-filter:blur(12px)}
#osk.show{display:block}.kr{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.ok{background:#2a3347;color:#fff;border:0;border-radius:10px;min-width:62px;height:42px;font-size:20px;font-weight:600;cursor:pointer;flex:0 0 auto}
.ok.w{min-width:92px;background:#1e2636}.ok.sp{min-width:360px}.ok.on{background:var(--accent);color:#1a1200}.ok.a{background:var(--accent);color:#1a1200}
@media (max-height:560px){.ok{height:38px;font-size:18px;min-width:58px}}
#ptr,#touchbadge{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:var(--glass2);border:1px solid var(--line);color:#fff;border-radius:16px;padding:12px 18px;font-size:17px;cursor:pointer}.chip.on{background:var(--accent);color:#1a1200;font-weight:700;border-color:transparent}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.krow{display:flex;align-items:center;gap:12px;background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:10px 14px}.krow .kn{flex:1;font-size:16px}.krow .kv{min-width:70px;text-align:center;font-weight:700;font-size:18px;background:#0006;border-radius:10px;padding:6px 10px}.krow .kv.wait{background:var(--accent);color:#1a1200}.btn.s{padding:8px 14px;font-size:15px}
#ptr{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;display:none;transform:translate(-4px,-2px)}
#ptr.down svg{transform:scale(.82)}#ptr:after{content:'';position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);opacity:0}
#ptr.down:after{opacity:.9}
#touchbadge{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:9998;background:var(--accent);color:#1a1200;font-weight:800;font-size:13px;padding:4px 14px;border-radius:14px;display:none;letter-spacing:.08em}
@media (max-height:560px){
 :root{--bar:36px;--gest:26px}
 #status{font-size:15px;padding:0 20px}#status svg{width:19px;height:19px}
 #home{padding:calc(var(--bar) + 6px) 22px 48px;gap:20px;grid-template-columns:minmax(260px,38%) 1fr}
 #left{gap:10px}
 #clock{padding:10px 18px;border-radius:20px}#clock .t{font-size:54px}#clock .d{font-size:14px}
 #truck{padding:10px 16px;gap:6px 14px;border-radius:20px}#truck .k{font-size:11px}#truck .v{font-size:26px}#truck .v small{font-size:13px}
 #np{display:none}
 #grid{grid-template-columns:repeat(4,1fr);gap:12px 8px;padding-top:2px}
 .ic{width:68px;height:68px;border-radius:20px}.ic svg{width:36px;height:36px}.app span{font-size:13px;font-weight:600}
 #dock{display:none}
 #gest button{height:var(--gest)}#gest svg{width:16px;height:16px}#gest #b-home i{width:120px;height:5px}
 .page iframe{top:var(--bar)}
 .settings{padding-top:calc(var(--bar) + 12px)!important}
 .settings h2{font-size:21px}.settings p{font-size:13px}.chip{font-size:14px!important;padding:8px 13px!important}.krow .kn{font-size:14px!important}.krow .kv{font-size:15px!important}
}
.native{display:grid;place-items:center;height:100%;text-align:center;padding:30px;color:var(--sub)}
.native b{color:#fff;font-size:26px;display:block;margin-bottom:10px}.native a{color:var(--accent)}
</style>
</head>
<body>
<div id="wall"></div>
<div id="status"><span id="st-clock">--:--</span><span id="st-title"></span><span class="sp"></span><span id="st-speed">0 km/h</span>
 <svg id="st-gps" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
 <svg viewBox="0 0 24 24"><path d="M2 20h3v-4H2zm5 0h3v-8H7zm5 0h3V8h-3zm5 0h3V3h-3z"/></svg>
 <svg viewBox="0 0 24 24"><path d="M16 7V5h-2V3h-4v2H8v2H6v14h12V7z" opacity=".95"/></svg></div>
<div id="stage">
 <div class="page show" id="home">
  <div id="left">
   <div class="glass" id="clock"><div class="t" id="c-t">--:--</div><div class="d" id="c-d"></div></div>
   <div class="glass" id="truck">
    <div><div class="k" data-i="speed">Vitesse</div><div class="v"><span id="t-speed">0</span><small>km/h</small></div></div>
    <div><div class="k" data-i="range">Autonomie</div><div class="v"><span id="t-range">0</span><small>km</small></div></div>
    <div class="full"><div class="k" data-i="fuel">Carburant</div><div class="bar"><div id="fuelbar"></div></div></div>
   </div>
   <div class="glass" id="np"><div class="ic" style="width:46px;height:46px;border-radius:14px"></div><div><b id="np-t">Radio</b><small id="np-s" data-i="nothing">Aucune lecture</small></div></div>
  </div>
  <div id="grid"></div>
 </div>
</div>
<div class="glass" id="dock"></div>
<div id="ptr"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2l15 9-6.500 1.800L9.800 20z" fill="#fff" stroke="#000" stroke-width="1.600" stroke-linejoin="round"/></svg></div><div id="touchbadge">MODE TOUCHER</div>
<div id="osk"></div>
<div id="recents"></div>
<div id="gest"><button id="b-back" title="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="b-home" title="Accueil"><i></i></button><button id="b-kb" class="sc" title="Keyboard">⌨</button><button id="b-dn" class="sc" title="Scroll ▼">▼</button><button id="b-up" class="sc" title="Scroll ▲">▲</button><button id="b-rec" title="Applications ouvertes"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button></div>

<script>
'use strict';
/* Truck Tablet : shell multi-pages. Apps = pages web (iframe) decrites par {id,name,glyph,color,url,type}.
   Telemetrie relayee aux apps: {tablet:1,type:'telemetry',data}. Apps -> shell: {tablet:1,type:'open'|'home'|'hello'}.
   Apps externes (YouTube Music, Deezer...) : en hote WebView2 elles s'ouvrent en vue native (host=native). */
const $=id=>document.getElementById(id);
const G={ // glyphes SVG (viewBox 24)
 nav:'<path d="M12 2l8 19-8-4-8 4z"/>',
 radio:'<path d="M4 8h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm1 3v7h8v-7zm11 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM4 6l14-4 .6 1.9L4.9 7.9z"/>',
 play:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 5.5l7 4.5-7 4.5z"/>',
 deezer:'<path d="M3 17h4v3H3zm5 0h4v3H8zm5 0h4v3h-4zm5 0h4v3h-4zM13 12h4v3h-4zm5 0h4v3h-4zM18 7h4v3h-4zM3 12h4v3H3zm5 0h4v3H8z"/>',
 spot:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.8.8 0 0 1-1.1.3c-3-1.8-6.700-2.200-11.100-1.200a.8.8 0 1 1-.4-1.500c4.800-1.100 8.900-.6 12.300 1.400.4.200.5.700.3 1zm1.500-3.400a1 1 0 0 1-1.400.3c-3.400-2.100-8.600-2.700-12.600-1.500a1 1 0 0 1-.6-1.900c4.600-1.400 10.300-.7 14.200 1.700.5.300.6.900.4 1.400zm.1-3.500C14.200 7.100 7.700 6.900 3.900 8.100a1.200 1.200 0 1 1-.7-2.300c4.300-1.300 11.500-1.100 16 1.600a1.200 1.200 0 0 1-1.200 2.100z"/>',
 gear:'<path d="M19.400 13a7.500 7.500 0 0 0 0-2l2.100-1.600-2-3.500-2.500 1a7.500 7.500 0 0 0-1.700-1L15 3h-4l-.4 2.900a7.500 7.500 0 0 0-1.700 1l-2.500-1-2 3.500L6.600 11a7.500 7.500 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.7 1.700 1L11 21h4l.4-2.900c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/>',
 bag:'<path d="M6 7V6a6 6 0 0 1 12 0v1h3l-1.200 14H4.200L3 7zm2 0h8V6a4 4 0 0 0-8 0zm-.5 3v2a1 1 0 0 0 2 0v-2zm7 0v2a1 1 0 0 0 2 0v-2z"/>',
 puzzle:'<path d="M20 11h-1V7a2 2 0 0 0-2-2h-4V4a2 2 0 1 0-4 0v1H5a2 2 0 0 0-2 2v4h1a2 2 0 1 1 0 4H3v4a2 2 0 0 0 2 2h4v-1a2 2 0 1 1 4 0v1h4a2 2 0 0 0 2-2v-4h1a2 2 0 1 0 0-4z"/>'
};
const BUILTIN=[
 {id:'gps',nk:'nav',name:'Navigation',glyph:'nav',color:'linear-gradient(145deg,#f7b733,#d9820b)',url:'../index.html',type:'local',dock:1},
 {id:'radio',nk:'radio',name:'Radio',glyph:'radio',color:'linear-gradient(145deg,#a855f7,#6d28d9)',url:'apps/radio/index.html',type:'local',dock:1},
 {id:'store',name:'Farbound Store',glyph:'bag',color:'linear-gradient(145deg,#26c6da,#00796b)',url:'apps/store/index.html',type:'local'},
 {id:'settings',nk:'settings',name:'Réglages',glyph:'gear',color:'linear-gradient(145deg,#7b8494,#444b59)',url:'#settings',type:'system',dock:1}
];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let userApps=load('tablet.apps',[]);
/* ===== Versions : version de la tablette + verification des mises a jour (GitHub Releases) ===== */
const TABLET_VERSION='1.0.0-beta',TABLET_REPO='FarboundStudios/farbound-tab';
const verParts=v=>String(v||'0').replace(/^v/i,'').split(/[.+-]/).slice(0,3).map(x=>parseInt(x,10)||0);
const cmpVer=(a,b)=>{const x=verParts(a),y=verParts(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0)?1:-1}return 0};
let updInfo=load('tab.update',null),updState=updInfo&&cmpVer(updInfo.tag,TABLET_VERSION)>0?'avail':'idle';
async function checkUpdate(manual){
  if(manual){updState='checking';rebuildSettings()}
  try{const c=new AbortController(),h=setTimeout(()=>c.abort(),8000);
    const r=await fetch('https://api.github.com/repos/'+TABLET_REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},signal:c.signal,cache:'no-store'});clearTimeout(h);
    if(r.status===404){updInfo={tag:TABLET_VERSION,at:Date.now()};updState='none'}
    else{if(!r.ok)throw 0;const j=await r.json();updInfo={tag:j.tag_name,name:j.name,url:j.html_url,notes:(j.body||'').slice(0,600),at:Date.now()};updState=cmpVer(j.tag_name,TABLET_VERSION)>0?'avail':'none'}
    store('tab.update',updInfo)}
  catch{updState=manual?'err':updState}
  rebuildSettings()}
setTimeout(()=>{if(!updInfo||Date.now()-(updInfo.at||0)>12*3600e3)checkUpdate(false)},8000);
const allApps=()=>BUILTIN.concat(userApps);
const byId=id=>allApps().find(a=>a.id===id);
const DLLMODE=new URLSearchParams(location.search).get('host')==='dll';
const NATIVE=!DLLMODE&&(new URLSearchParams(location.search).get('host')==='native'||!!window.chrome?.webview);
/* ===== Langues (FR, EN, DE, IT, ES) : par defaut la langue du jeu (config.cfg), modifiable dans Reglages ===== */
const I18N={
 fr:{d_title:'Farbound Drive (tableau de bord)',d_theme:'Style',d_auto:'Auto (marque du camion)',d_accent:'Couleur',d_layout:'Disposition',d_classic:'Classique',d_sport:'Sport',d_minimal:'Minimal',d_units:'Unités',d_show:'Éléments affichés',d_limit:'Limite',d_clock:'Heure',d_odo:'Compteur',d_fuel:'Carburant',d_adblue:'AdBlue',d_temp:'Température',d_range:'Autonomie',d_cruise:'Régulateur',d_gear:'Rapport',d_rpm:'Compte-tours', nav:'Navigation',radio:'Radio',ytm:'YouTube Music',deezer:'Deezer',spotify:'Spotify',settings:'Réglages',speed:'Vitesse',range:'Autonomie',fuel:'Carburant',nothing:'Aucune lecture',noapps:'Aucune application ouverte',
  s_lang:'Langue',s_appzoom:'Zoom des apps web',s_auto:'Automatique (langue du jeu)',s_size:'Taille de l’interface',s_keys:'Commandes du curseur',s_keys_help:'Touchez « Modifier » puis appuyez sur la touche voulue (Échap pour annuler).',s_reset:'Réinitialiser',s_change:'Modifier',s_press:'Appuyez sur une touche…',
