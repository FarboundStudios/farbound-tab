<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio</title>
<style>
:root{--ac:#c084fc;--bg:#12091c;--card:#2a1740;--card2:#3b2159}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none;overflow:hidden}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%;padding:14px 22px 10px;gap:10px}
.tabs,.chips{display:flex;gap:10px;flex-wrap:wrap}
.tab,.chip{background:var(--card);color:#fff;border:2px solid transparent;border-radius:16px;padding:10px 18px;font-size:18px;cursor:pointer}
.tab.on,.chip.on{background:var(--ac);color:#1d0b2e;font-weight:700}
.chip{font-size:15px;padding:7px 14px;border-radius:14px}
#list{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding-right:4px}
.it{background:var(--card);border-radius:16px;padding:12px 16px;cursor:pointer;border:2px solid transparent;min-height:66px}
.it.on{border-color:var(--ac);background:var(--card2)}
.it b{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:#b9a7cc;font-size:14px}
.it .fav{color:#ffd166;margin-right:6px}
#bar{display:flex;align-items:center;gap:14px;background:#1d0f2e;border-radius:18px;padding:10px 14px}
#bar button{background:var(--ac);border:0;color:#1d0b2e;border-radius:50%;width:56px;height:56px;font-size:24px;cursor:pointer}
#bar button.s{background:var(--card);color:#fff;width:46px;height:46px;font-size:20px}
#now{flex:1;min-width:0}#now b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#now small{color:#b9a7cc}
#bar button.on{background:var(--ac);color:#1d0b2e}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--ac);border-radius:6px;border:2px solid var(--bg);opacity:.8}::-webkit-scrollbar-thumb:hover{background:#fff}
#empty{color:#b9a7cc;font-size:18px;padding:20px}
</style></head><body>
<div id="app">
 <div class="tabs"><button class="tab on" id="t-net"></button><button class="tab" id="t-music"></button></div>
 <div class="chips" id="chips"></div>
 <div id="list"></div>
 <div id="bar"><button class="s" id="prev">⏮</button><button id="pp">▶</button><button class="s" id="next">⏭</button><button class="s" id="rnd" title="Random">🔀</button><div id="now"><b id="n1">—</b><small id="n2"></small></div></div>
</div>
<script>
'use strict';
/* Radio : (1) radios en ligne de la liste du jeu (live_streams.sii, favoris du jeu en premier) ; (2) musique du dossier "music" du jeu. */
const L={
 fr:{net:'Radios du jeu',music:'Musique du jeu',all:'Toutes',fav:'Favoris',none:'Aucune musique trouvée dans Documents\\Euro Truck Simulator 2\\music',rnd:'Aléatoire',nothing:'Aucune lecture',err:'Flux indisponible',loading:'Chargement…'},
 en:{net:'Game radios',music:'Game music',all:'All',fav:'Favorites',none:'No music found in Documents\\Euro Truck Simulator 2\\music',rnd:'Randomize',nothing:'Nothing playing',err:'Stream unavailable',loading:'Loading…'},
 de:{net:'Spiel-Radios',music:'Spielmusik',all:'Alle',fav:'Favoriten',none:'Keine Musik in Documents\\Euro Truck Simulator 2\\music gefunden',rnd:'Zufall',nothing:'Keine Wiedergabe',err:'Stream nicht verfügbar',loading:'Lädt…'},
 it:{net:'Radio del gioco',music:'Musica del gioco',all:'Tutte',fav:'Preferiti',none:'Nessuna musica in Documents\\Euro Truck Simulator 2\\music',rnd:'Casuale',nothing:'Nessuna riproduzione',err:'Flusso non disponibile',loading:'Caricamento…'},
 es:{net:'Radios del juego',music:'Música del juego',all:'Todas',fav:'Favoritas',none:'No hay música en Documents\\Euro Truck Simulator 2\\music',rnd:'Aleatorio',nothing:'Sin reproducción',err:'Flujo no disponible',loading:'Cargando…'}
};
let lang='fr',tab='net',filter='fav',radios=[],music=[],cur=-1,list=[];
const au=new Audio();au.volume=.8;
const $=i=>document.getElementById(i),t=k=>(L[lang]||L.en)[k];
const send=m=>parent.postMessage(Object.assign({tablet:1},m),'*');
let shuffle=false;
function randIdx(){if(list.length<2)return 0;let k;do{k=Math.floor(Math.random()*list.length)}while(k===cur);return k}
function texts(){$('rnd').title=t('rnd');$('t-net').textContent=t('net');$('t-music').textContent=t('music');if(cur<0)$('n1').textContent=t('nothing')}
function chips(){
  const c=$('chips');c.textContent='';if(tab!=='net')return;
  const langs=[...new Set(radios.map(r=>(r[3]||'').toUpperCase()).filter(Boolean))].sort();
  const mk=(id,label)=>{const b=document.createElement('button');b.className='chip'+(filter===id?' on':'');b.textContent=label;b.onclick=()=>{filter=id;chips();render()};c.append(b)};
  mk('fav','★ '+t('fav'));mk('all',t('all'));for(const l of langs.slice(0,14))mk(l,l);
}
function render(){
  const el=$('list');el.textContent='';
  if(tab==='net'){
    list=radios.filter(r=>filter==='all'?true:filter==='fav'?r[5]==='1':(r[3]||'').toUpperCase()===filter);
    list.sort((a,b)=>(b[5]==='1')-(a[5]==='1')||a[1].localeCompare(b[1]));
    list.forEach((r,i)=>{const d=document.createElement('div');d.className='it'+(i===cur&&tab===playTab?' on':'');
      const b=document.createElement('b');if(r[5]==='1'){const f=document.createElement('span');f.className='fav';f.textContent='★';b.append(f)}b.append(r[1]);
      const s=document.createElement('small');s.textContent=[r[2],r[3],r[4]?r[4]+' kbps':''].filter(Boolean).join(' · ');d.append(b,s);d.onclick=()=>play(i);el.append(d)});
  }else{
    list=music.map(f=>({n:f.replace(/^.*[\\/]/,'').replace(/\.[^.]+$/,''),f}));
    if(!list.length){const e=document.createElement('div');e.id='empty';e.textContent=t('none');el.append(e)}
    list.forEach((m,i)=>{const d=document.createElement('div');d.className='it'+(i===cur&&tab===playTab?' on':'');
      const b=document.createElement('b');b.textContent=m.n;const s=document.createElement('small');s.textContent=m.f.includes('/')?m.f.split('/')[0]:'';d.append(b,s);d.onclick=()=>play(i);el.append(d)});
  }
}
let playTab='net';
function play(i){
  cur=i;playTab=tab;const it=list[i];if(!it)return;
  if(tab==='net'){au.src=it[0];$('n1').textContent=it[1];$('n2').textContent=[it[2],it[3]].filter(Boolean).join(' · ')}
  else{au.src='https://music.local/'+it.f.split('/').map(encodeURIComponent).join('/');$('n1').textContent=it.n;$('n2').textContent=it.f.includes('/')?it.f.split('/')[0]:''}
  au.play().catch(()=>{$('n2').textContent=t('err')});$('pp').textContent='⏸';
  send({type:'nowplaying',title:$('n1').textContent,artist:$('n2').textContent});render();
}
$('pp').onclick=()=>{if(au.paused){if(cur<0&&list.length)play(0);else au.play();$('pp').textContent='⏸'}else{au.pause();$('pp').textContent='▶'}};
$('next').onclick=()=>{if(list.length)play(shuffle?randIdx():(cur+1)%list.length)};
$('rnd').onclick=()=>{shuffle=!shuffle;$('rnd').classList.toggle('on',shuffle);if(shuffle&&list.length)play(randIdx())};   // mode aleatoire : joue au hasard, puis suivant/precedent/fin de piste restent aleatoires; re-cliquer le desactive
$('prev').onclick=()=>{if(list.length)play(shuffle?randIdx():(cur-1+list.length)%list.length)};
au.addEventListener('ended',()=>{if(playTab==='music'||shuffle)$('next').click()});
function setTab(x){tab=x;$('t-net').classList.toggle('on',x==='net');$('t-music').classList.toggle('on',x==='music');chips();render()}
$('t-net').onclick=()=>setTab('net');$('t-music').onclick=()=>setTab('music');
addEventListener('message',e=>{const m=e.data;if(!m||!m.tablet)return;
  if(m.type==='prefs'&&m.lang){lang=m.lang;texts();chips();render()}
  else if(m.type==='radios'&&Array.isArray(m.data)){radios=m.data;chips();render()}
  else if(m.type==='music'&&Array.isArray(m.data)){music=m.data;render()}
  else if(m.type==='back'){/* rien */}});
texts();send({type:'hello'});send({type:'cmd',cmd:'radios?'});send({type:'cmd',cmd:'music?'});
</script></body></html>
